<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Trip Planner - 智能助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-text-size-adjust: 100%;
    }

    .chat-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 16px 20px;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .chat-header .app-title {
      flex: 1;
      text-align: center;
    }

    .chat-header select {
      max-width: 104px;
      padding: 4px 6px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    .chat-header select option { color: #333; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 16px;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 14px;
      animation: fadeIn 0.3s ease;
      word-break: break-word;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: #667eea;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: #f1f3f5;
      color: #333;
      border-bottom-left-radius: 4px;
    }

    .message .tool-tag {
      display: inline-block;
      font-size: 11px;
      background: rgba(255,255,255,0.25);
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 6px;
    }

    .message.assistant .tool-tag {
      background: #e9ecef;
      color: #764ba2;
    }

    .chat-input-area {
      display: flex;
      padding: 12px 16px;
      border-top: 1px solid #eee;
      gap: 10px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 10px 16px;
      border: 2px solid #e9ecef;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input-area input:focus {
      border-color: #667eea;
    }

    .chat-input-area button {
      padding: 10px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .chat-input-area button:hover { opacity: 0.9; }
    .chat-input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 10px 16px;
    }

    .typing-indicator span {
      width: 8px; height: 8px;
      background: #adb5bd;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }

    .route-message {
      width: 100%;
      max-width: 100%;
      padding: 0;
      background: transparent;
    }

    .route-card {
      background: #fff;
      border: 1px solid #e9ecef;
      border-radius: 14px;
      overflow: hidden;
    }

    .route-map {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      background: #f1f3f5;
    }

    .route-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 12px 6px;
    }

    .route-stat {
      font-size: 12px;
      color: #495057;
      background: #f1f3f5;
      border-radius: 999px;
      padding: 4px 10px;
      white-space: nowrap;
    }

    .route-stop-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px 12px 14px;
    }

    .route-stop {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      color: #333;
    }

    .route-index {
      flex: 0 0 18px;
      width: 18px;
      height: 18px;
      margin-top: 1px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-size: 11px;
      line-height: 18px;
      text-align: center;
    }

    .route-stop-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .route-stop-name {
      font-weight: 600;
      word-break: break-word;
    }

    .route-leg {
      font-size: 11px;
      color: #868e96;
    }

    .recommendation-message {
      width: 100%;
      max-width: 100%;
      padding: 0;
      background: transparent;
    }

    .attraction-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .attraction-card {
      display: flex;
      gap: 10px;
      padding: 8px;
      background: #fff;
      border: 1px solid #e9ecef;
      border-radius: 14px;
    }

    .attraction-photo {
      flex: 0 0 84px;
      width: 84px;
      height: 84px;
      border-radius: 10px;
      object-fit: cover;
      background: #f1f3f5;
    }

    .attraction-photo-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
      color: #adb5bd;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    }

    .attraction-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      min-width: 0;
    }

    .attraction-name {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .attraction-meta {
      font-size: 12px;
      line-height: 1.5;
      color: #868e96;
      word-break: break-word;
    }

    .food-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .food-suitable {
      font-size: 11px;
      color: #764ba2;
      background: #f0edff;
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
    }

    .stay-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .stay-tag {
      font-size: 11px;
      color: #0b7285;
      background: #e3fafc;
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
    }

    .stay-price {
      font-size: 12px;
      font-weight: 600;
      color: #e8590c;
    }

    .stay-room {
      font-size: 11px;
      color: #868e96;
    }

    .stay-phone {
      font-size: 12px;
      color: #1971c2;
      text-decoration: none;
      word-break: break-all;
    }

    .stay-address {
      font-size: 12px;
      color: #868e96;
      word-break: break-word;
    }

    .attraction-card.clickable {
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .attraction-card.clickable:hover,
    .attraction-card.clickable:focus-visible {
      border-color: #667eea;
      box-shadow: 0 2px 10px rgba(102, 126, 234, 0.18);
      outline: none;
    }

    .attraction-hint {
      font-size: 11px;
      color: #667eea;
    }

    .product-price {
      font-size: 14px;
      font-weight: 700;
      color: #e8590c;
      white-space: nowrap;
    }

    .product-tags {
      font-size: 11px;
      color: #764ba2;
      word-break: break-word;
    }

    .product-link {
      font-size: 12px;
      font-weight: 600;
      color: #1971c2;
      text-decoration: none;
    }

    .product-link:hover { text-decoration: underline; }

    .transport-summary {
      padding: 4px 4px 8px;
      font-size: 12px;
      color: #495057;
    }

    .transport-mode {
      font-size: 11px;
      font-weight: 600;
      color: #5f3dc4;
      background: #f3f0ff;
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
    }

    .transport-price {
      font-size: 14px;
      font-weight: 700;
      color: #e8590c;
      white-space: nowrap;
    }

    .transport-badge {
      font-size: 11px;
      color: #2b8a3e;
      background: #ebfbee;
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
    }

    @media (min-width: 700px) {
      body { padding: 24px; }

      .chat-container {
        width: min(1080px, 100%);
        height: min(880px, calc(100dvh - 48px));
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.14);
      }

      .chat-header {
        padding: 18px 26px;
        font-size: 19px;
      }

      .chat-header .app-title { text-align: left; }
      .chat-header select { max-width: 130px; }

      .chat-messages {
        padding: 24px;
        gap: 14px;
      }

      .message {
        max-width: min(78%, 680px);
        font-size: 15px;
      }

      .route-message,
      .recommendation-message { max-width: 100%; }

      .chat-input-area {
        padding: 16px 24px;
        gap: 12px;
      }

      .chat-input-area input {
        font-size: 15px;
        padding: 12px 18px;
      }

      .chat-input-area button {
        font-size: 15px;
        padding: 12px 28px;
      }

      .attraction-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 10px;
      }

      .attraction-card { height: 100%; }

      .attraction-photo {
        flex-basis: 96px;
        width: 96px;
        height: 96px;
      }

      .route-card {
        max-width: 720px;
        margin: 0 auto;
      }
    }

    @media (max-width: 699px) {
      body { align-items: stretch; }

      .chat-container { max-width: 100%; }

      .chat-header {
        padding: 12px 14px;
        padding-top: calc(12px + env(safe-area-inset-top));
        padding-left: calc(14px + env(safe-area-inset-left));
        padding-right: calc(14px + env(safe-area-inset-right));
        font-size: 16px;
      }

      .chat-header .app-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: left;
      }

      .chat-header select {
        flex: 0 0 auto;
        max-width: 112px;
        min-height: 44px;
        padding: 6px 8px;
        font-size: 16px;
      }

      .chat-messages {
        padding: 12px;
        padding-left: calc(12px + env(safe-area-inset-left));
        padding-right: calc(12px + env(safe-area-inset-right));
        overflow-x: hidden;
      }

      .message { max-width: 88%; }

      /* 路线/推荐卡片占满可用宽度，不被气泡宽度限制 */
      .message.route-message,
      .message.recommendation-message {
        max-width: 100%;
      }

      .chat-input-area {
        padding: 8px 12px;
        padding-left: calc(12px + env(safe-area-inset-left));
        padding-right: calc(12px + env(safe-area-inset-right));
        padding-bottom: calc(8px + env(safe-area-inset-bottom));
        gap: 8px;
      }

      .chat-input-area input {
        min-width: 0;
        padding: 10px 14px;
        font-size: 16px;
      }

      .chat-input-area button {
        flex: 0 0 auto;
        min-height: 44px;
        padding: 10px 18px;
        font-size: 15px;
      }

      .chat-messages img { max-width: 100%; }

      .attraction-card { align-items: flex-start; }

      .attraction-photo {
        flex: 0 0 76px;
        width: 76px;
        height: 76px;
      }

      .attraction-name {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .attraction-meta,
      .stay-address,
      .stay-title,
      .product-tags {
        overflow-wrap: anywhere;
      }

      .product-link {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 2px 0;
      }

      /* 11px 在手机上过小，统一提到 12px 保证可读性 */
      .route-leg,
      .attraction-hint,
      .food-suitable,
      .stay-tag,
      .stay-room,
      .product-tags,
      .transport-mode,
      .transport-badge {
        font-size: 12px;
      }

      .route-stat {
        max-width: 100%;
        white-space: normal;
      }
    }

    @media (max-width: 699px) and (max-height: 500px) {
      .chat-header {
        padding-top: calc(6px + env(safe-area-inset-top));
        padding-bottom: 6px;
      }

      .chat-messages {
        padding-top: 8px;
        padding-bottom: 8px;
      }
    }

    @media (max-width: 520px) {
      .chat-header {
        padding-top: calc(16px + env(safe-area-inset-top));
      }

      .message {
        max-width: 88%;
      }

      .chat-input-area {
        padding: 10px 12px;
        padding-left: calc(12px + env(safe-area-inset-left));
        padding-right: calc(12px + env(safe-area-inset-right));
        padding-bottom: calc(10px + env(safe-area-inset-bottom));
      }

      /* 16px 可避免 iOS Safari 聚焦输入框时自动放大页面 */
      .chat-input-area input {
        font-size: 16px;
      }
    }

    /* 横屏手机宽度常大于 699px，会走桌面布局，这里补齐刘海屏左右安全区 */
    @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
      .chat-header {
        padding-left: calc(20px + env(safe-area-inset-left));
        padding-right: calc(20px + env(safe-area-inset-right));
      }

      .chat-input-area {
        padding-left: calc(16px + env(safe-area-inset-left));
        padding-right: calc(16px + env(safe-area-inset-right));
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <span class="app-title" id="appTitle">🤖 Trip Planner 智能助手</span>
      <select id="langSelect" aria-label="Language">
        <option value="zh-CN">中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
      </select>
    </div>

    <div class="chat-messages" id="messages">
      <div class="message assistant" id="welcomeMessage">
        你好！我是 Trip Planner 助手。<br>
        可以问我天气，或告诉我你想去的景点，我来规划游玩路线 🌤️
      </div>
    </div>

    <div class="chat-input-area">
      <input
        type="text"
        id="userInput"
        placeholder="输入消息，如：我想去外滩、豫园、东方明珠"
        autocomplete="off"
      />
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <script>
    const API_URL = "/chat";
    const PRODUCT_API = "/api/products";
    const HOTEL_API = "/api/hotels";
    const CLIENT_ID = (() => {
      const storageKey = "tripClientId";
      try {
        let value = localStorage.getItem(storageKey);
        if (!value) {
          value =
            (window.crypto && crypto.randomUUID && crypto.randomUUID()) ||
            `c-${Date.now()}-${Math.random().toString(16).slice(2)}`;
          localStorage.setItem(storageKey, value);
        }
        return value;
      } catch {
        return `c-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }
    })();
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const conversation = [];
    const seenStays = [];
    const loadingCards = new Set();
    // 最近一次酒店查询使用的入住/退房日期，卡片再次查询时沿用
    let currentStayDates = null;

    // 界面文案与助手回复共用同一套语言代码
    const I18N = {
      "zh-CN": {
        pageTitle: "Trip Planner - 智能助手",
        appTitle: "🤖 Trip Planner 智能助手",
        welcome: "你好！我是 Trip Planner 助手。<br>可以问我天气，或告诉我你想去的景点，我来规划游玩路线 🌤️",
        placeholder: "输入消息，如：我想去外滩、豫园、东方明珠",
        send: "发送",
        tools: {
          fetch_weather: "天气查询",
          plan_trip_route: "路线规划",
          recommend_attractions: "景点推荐",
          recommend_food: "美食推荐",
          recommend_stay: "住宿推荐",
          recommend_hotel_deals: "酒店房价",
          recommend_products: "项目与价格",
          plan_transport: "出行比价",
        },
        mapAlt: "游玩路线地图",
        routeTotal: (d) => `全程 ${d}`,
        routeDriving: (d) => `驾车 ${d}`,
        routeMode: { distance: "最短距离", time: "最省时间" },
        leg: (d, t) => `↓ 驾车 ${d} · ${t}`,
        distance: (m) => (m >= 1000 ? `${(m / 1000).toFixed(1)} 公里` : `${m} 米`),
        duration: (s) => {
          const minutes = Math.round(s / 60);
          return minutes < 60 ? `${minutes} 分钟` : `${Math.floor(minutes / 60)} 小时 ${minutes % 60} 分钟`;
        },
        rating: (r) => `评分 ${r}`,
        noRating: "评分暂无",
        viewTickets: "点击查看门票与项目 →",
        priceNote: "价格以下单页为准",
        viewDetail: "查看详情 / 预订 →",
        viewRoom: "查看房型 / 预订 →",
        viewRoomDates: (d) => `查看房型 / 预订（${d}）→`,
        stayViewPrice: "查看实时房价",
        stayHint: "点击查看实时房价 →",
        room: (types, status) => `房型：${types || "单人间/双人间（可询）"} · ${status || "房态请电话确认"}`,
        phone: (tel) => `电话 ${tel}`,
        phoneConsult: "电话需现场或平台咨询",
        stayDates: (a, b) => `入住 ${a} · 退房 ${b}`,
        fromTo: (a, b) => `从${a}到${b}`,
        people: (n) => `${n}人`,
        depart: (date) => `${date} 出发`,
        distanceKm: (km) => `约 ${km} 公里`,
        cheapest: "最省",
        fastest: "最快",
        totalCost: (p) => `总花费 ${p}`,
        durationApprox: (d) => `耗时约 ${d}`,
        viewTicket: "查看票价 / 预订 →",
        notesJoin: "；",
        viewTicketsQuery: (poi) => `查看「${poi}」的门票和项目`,
        productsFound: (poi, n) => `为你找到「${poi}」的 ${n} 个可预订项目，价格来自飞猪实时数据，以下单页为准。`,
        noProducts: (poi) => `暂时没有找到「${poi}」的可预订项目，可以换个景点试试～`,
        productsError: "项目查询失败，请确认技能服务已启动（端口 3000）",
        viewRoomQuery: (hotel) => `查看「${hotel}」的实时房价`,
        hotelFound: (hotel, n) => `为你找到「${hotel}」的 ${n} 个房价方案，来自飞猪实时数据，以下单页为准。`,
        hotelFallback: (hotel, n) => `飞猪暂未收录「${hotel}」，为你找到 ${n} 个同城同类住宿价格，以下单页为准。`,
        noHotelDeals: (hotel) => `暂时没有找到「${hotel}」的房价，可以换个酒店试试～`,
        hotelsError: "房价查询失败，请确认技能服务已启动（端口 3000）",
        timeout: "请求超时，请稍后重试",
        assistantUnavailable: "助手暂时不可用，请稍后重试",
        backendDown: "连接后端失败，请确认后端已启动",
      },
      en: {

    const langSelect = document.getElementById("langSelect");
    const appTitle = document.getElementById("appTitle");
    const welcomeMessage = document.getElementById("welcomeMessage");

    function detectLanguage() {
      const saved = localStorage.getItem("tripLanguage");
      if (saved && I18N[saved]) return saved;
      const browserLang = (navigator.language || "en").toLowerCase();
      if (browserLang.startsWith("zh")) return "zh-CN";
      const base = browserLang.split("-")[0];
      // 面向来华游客，浏览器语言不在支持列表时默认英文
      return I18N[base] ? base : "en";
    }

    let currentLang = detectLanguage();

    function t(key, ...args) {
      const value = I18N[currentLang][key];
      return typeof value === "function" ? value(...args) : value ?? key;
    }

    function applyLanguage(lang) {
      currentLang = I18N[lang] ? lang : "en";
      localStorage.setItem("tripLanguage", currentLang);
      document.documentElement.lang = currentLang;
      document.title = t("pageTitle");
      appTitle.textContent = t("appTitle");
      langSelect.value = currentLang;
      inputEl.placeholder = t("placeholder");
      sendBtn.textContent = t("send");
      if (!conversation.length) {
        welcomeMessage.innerHTML = t("welcome");
      }
    }

    langSelect.addEventListener("change", () => applyLanguage(langSelect.value));
    applyLanguage(currentLang);

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    function formatText(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\n/g, "<br>");
    }

    function apiErrorMessage(data, fallback) {
      const detail = data && (data.detail || data.error);
      if (typeof detail === "string" && detail.trim()) return detail;
      if (Array.isArray(detail)) {
        const parts = detail
          .map((item) => (item && (item.msg || item.message)) || "")
          .filter(Boolean);
        if (parts.length) return parts.join("；");
      }
      if (detail && typeof detail === "object" && typeof detail.message === "string") {
        return detail.message;
      }
      return fallback;
    }

    function addMessage(text, role, toolUsed) {
      const div = document.createElement("div");
      div.className = `message ${role}`;

      let prefix = "";
      if (role === "assistant" && toolUsed) {
        // 只渲染白名单里的工具名，服务端返回的任意字符串不直接进 HTML
        const tools = t("tools") || {};
        if (Object.prototype.hasOwnProperty.call(tools, toolUsed)) {
          prefix = `<span class="tool-tag">🔧 ${formatText(tools[toolUsed])}</span><br>`;
        }
      }
      div.innerHTML = prefix + formatText(text);

      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "message assistant typing-indicator";
      div.id = "typing";
      div.innerHTML = "<span></span><span></span><span></span>";
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById("typing");
      if (el) el.remove();
    }

    let pendingRequests = 0;

    function beginPending() {
      pendingRequests += 1;
      sendBtn.disabled = true;
      if (pendingRequests === 1) showTyping();
    }

    function endPending() {
      pendingRequests = Math.max(0, pendingRequests - 1);
      if (pendingRequests === 0) {
        hideTyping();
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function safeHttpUrl(value) {

        return "";
      }

    async function loadProducts(poi, city) {
      if (!poi || loadingCards.has(poi)) return;
      loadingCards.add(poi);

      const userText = t("viewTicketsQuery", poi);
      addMessage(userText, "user");
      conversation.push({ role: "user", content: userText });

      beginPending();

      try {
        const params = new URLSearchParams({ poi, limit: "6" });
        if (city) params.set("city", city);
        const res = await fetch(`${PRODUCT_API}?${params.toString()}`, {
          headers: {
            "X-Client-Id": CLIENT_ID,
            "X-Language": currentLang,
          },
        });
        const data = await res.json();

        if (!res.ok) throw new Error(apiErrorMessage(data, t("productsError")));
        if (!Array.isArray(data.items) || !data.items.length) {
          addMessage(t("noProducts", poi), "assistant");
          return;
        }

        const reply = t("productsFound", poi, data.items.length);
        addMessage(reply, "assistant", "recommend_products");
        addProductCards(data);
        conversation.push({ role: "assistant", content: reply });
        if (conversation.length > 20) conversation.splice(0, conversation.length - 20);
      } catch (err) {
        const message =
          err && err.message && err.message !== "Failed to fetch"
            ? err.message
            : t("productsError");
        addMessage(`⚠️ ${message}`, "assistant");
      } finally {
        loadingCards.delete(poi);
        endPending();
      }
    }

    async function loadHotelDeals(hotel, city) {
      if (!hotel || loadingCards.has(hotel)) return;

      addMessage(userText, "user");
      conversation.push({ role: "user", content: userText });

      try {
        const params = new URLSearchParams({ hotel, limit: "6" });
        if (city) params.set("city", city);
        if (currentStayDates) {
          params.set("check_in", currentStayDates.check_in);
          params.set("check_out", currentStayDates.check_out);
        }
        const res = await fetch(`${HOTEL_API}?${params.toString()}`, {
          headers: {
            "X-Client-Id": CLIENT_ID,
            "X-Language": currentLang,
          },
        });
        const data = await res.json();

        if (!res.ok) throw new Error(apiErrorMessage(data, t("hotelsError")));
        if (!Array.isArray(data.items) || !data.items.length) {
          addMessage(t("noHotelDeals", hotel), "assistant");
          return;
        }

        const reply = data.fallback
          ? t("hotelFallback", hotel, data.items.length)
          : t("hotelFound", hotel, data.items.length);
        addMessage(reply, "assistant", "recommend_hotel_deals");
        addHotelDealCards(data);
        rememberStayDates(data);
        conversation.push({ role: "assistant", content: reply });
        if (conversation.length > 20) conversation.splice(0, conversation.length - 20);
      } catch (err) {
        const message =
          err && err.message && err.message !== "Failed to fetch"
            ? err.message
            : t("hotelsError");
        addMessage(`⚠️ ${message}`, "assistant");
      } finally {
        loadingCards.delete(hotel);
        endPending();
      }
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage(text, "user");
      const history = conversation.slice(-6).map((item) => ({
        role: item.role,
        content: String(item.content || "").slice(0, 1000),
      }));
      conversation.push({ role: "user", content: text });
      inputEl.value = "";
      beginPending();

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 25000);

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Client-Id": CLIENT_ID,
            "X-Language": currentLang,
          },
          body: JSON.stringify({
            message: text,
            history,
            seen_stays: seenStays.slice(-50),
            language: currentLang,
          }),
          signal: controller.signal,
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(apiErrorMessage(data, t("assistantUnavailable")));
        }
        addMessage(data.reply, "assistant", data.tool_used);
        addRouteCard(data.route);
        addRecommendationCards(data.recommendation);
        addFoodCards(data.food);
        addStayCards(data.stay);
        addHotelDealCards(data.hotel_deals);
        rememberStayDates(data.hotel_deals);
        addProductCards(data.products);
        addTransportCards(data.transport);
        if (data.stay && Array.isArray(data.stay.stays)) {
          data.stay.stays.forEach((item) => {
            if (item.name && !seenStays.includes(item.name)) {
              seenStays.push(item.name);
              if (seenStays.length > 50) {
                seenStays.splice(0, seenStays.length - 50);
              }
            }
          });
        }
        conversation.push({ role: "assistant", content: data.reply });
        if (conversation.length > 20) conversation.splice(0, conversation.length - 20);
      } catch (err) {
        const message =
          err && err.name === "AbortError"
            ? t("timeout")
            : err && err.message && err.message !== "Failed to fetch"
              ? err.message
              : t("backendDown");
        addMessage(`⚠️ ${message}`, "assistant");
      } finally {
        clearTimeout(timer);
        endPending();
      }
    }
  </script>
</body>
