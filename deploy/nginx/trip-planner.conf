# 阿里云 ECS：Nginx 反向代理 127.0.0.1:3000
# 放置到 /etc/nginx/conf.d/trip-planner.conf 后执行 nginx -t && systemctl reload nginx
# server_name 先改成你的域名，再执行 certbot --nginx -d 你的域名 自动启用 HTTPS

proxy_cache_path /var/cache/nginx/trip levels=1:2 keys_zone=trip_map:20m max_size=1g inactive=30m use_temp_path=off;

upstream trip_planner {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80 default_server;
    server_name _;  # 换成你的域名，例如 trip.example.com

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # 启用 HTTPS 后再打开 HSTS：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
        proxy_pass http://trip_planner/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # 静态地图：Nginx 缓存 10 分钟，减少 Python 和高德重复请求
    location /api/map {
        proxy_pass http://trip_planner;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_cache trip_map;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    # 对话接口：单次预算 20 秒，Nginx 留出余量
    location /chat {
        proxy_pass http://trip_planner;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_intercept_errors on;
        # 只替换连接类错误；503/429 保留应用返回的本地化 JSON
        error_page 502 504 = @backend_json;
    }

    location /api/ {
        proxy_pass http://trip_planner;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_intercept_errors on;
        # 只替换连接类错误；503/429 保留应用返回的本地化 JSON
        error_page 502 504 = @backend_json;
    }

    location / {
        proxy_pass http://trip_planner;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location @backend_json {
        default_type application/json;
        return 503 '{"detail":"Service temporarily unavailable"}';
    }
}
